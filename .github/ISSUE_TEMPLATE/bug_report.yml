name: Bug report
description: Something in Stryx Skills does not work as it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for writing this up. Please take keys, passwords and private paths out of anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected to see instead.
      placeholder: When I ask Claude to ..., it ... I expected ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Open Claude Code in ...
        2. Type ...
        3. See ...
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Skill, agent or hook involved
      description: If you know it, for example stryx:debug or the stop judge.
      placeholder: stryx:...
  - type: input
    id: build
    attributes:
      label: Stryx Skills build
      description: The build you installed, if you know it.
      placeholder: "3.0.0"
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: The output of `claude --version`.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error text
      description: Paste the error or the relevant lines. It is shown as code, so no backticks needed.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I removed keys, passwords and private paths from what I pasted.
          required: true
        - label: I searched the open issues and this one is new.
          required: true
